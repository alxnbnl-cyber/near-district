[package]
name = "yielvy-vault"
version = "0.1.0"
edition = "2021"
publish = false
description = "Yielvy campaign vault: per-campaign accounting over a single RHEA supply position"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.1", features = ["legacy"] }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
