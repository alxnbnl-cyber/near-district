[package]
name = "near-district-prize-vault"
version = "1.0.0"
edition = "2021"
publish = false
description = "NEAR District prize vault: fixed mission prizes held in escrow and paid out in equal shares after the deadline"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
