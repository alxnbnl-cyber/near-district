# Local development services. App processes run on the host (pnpm dev / pnpm dev:worker).
services:
  postgres:
    image: postgres:17-alpine
    container_name: near-district-postgres
    environment:
      POSTGRES_USER: neardistrict
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: neardistrict
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - near-district-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neardistrict"]
      interval: 5s
      retries: 10

  # Runs the prize vault contract test-suite in Linux (no local Rust linker setup needed):
  #   docker compose run --rm contract-tests
  contract-tests:
    image: rust:1
    working_dir: /work
    volumes:
      - ./contracts/prize-vault:/work
      - near-district-cargo-registry:/usr/local/cargo/registry
      - near-district-cargo-target:/target
    environment:
      CARGO_TARGET_DIR: /target
    command: ["cargo", "test"]
    profiles: ["tools"]

volumes:
  near-district-pgdata:
  near-district-cargo-registry:
  near-district-cargo-target:
